services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: thedays
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - thedays-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d thedays"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  thedays-postgres-data:
